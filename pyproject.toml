[project]
name = "lesson-minkowski-space"
version = "1.0.0"
description = "Interactive lesson on Minkowski spacetime and special relativity"
readme = "README.md"
authors = [{name = "Dr. Elena Karov (AI Tutor)"}]
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.23.0",
    "numpy>=1.21",
    "matplotlib>=3.5",
    "sympy>=1.12",
    "watchdog>=3.0",
    "pypdf>=6.13.3",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.0",
    "pandas>=2.3.3",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "plotly>=6.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.marimo.runtime]
watcher_on_save = "autorun"
